<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Household Chore Schedule</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 9999px; }
    .chore-card { transition: all 0.18s ease; }
    @keyframes pulse-sync { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .sync-dot { animation: pulse-sync 2s infinite; }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center shadow-md shadow-blue-500/20">
          <i class="fa-solid fa-clipboard-check text-white text-lg"></i>
        </div>
        <div>
          <div class="flex items-center flex-wrap gap-2">
            <h1 class="text-lg sm:text-xl font-extrabold tracking-tight text-white">CHORE SCHEDULE</h1>
            <span id="syncBadge" onclick="openCloudModal()" class="cursor-pointer inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/30 hover:bg-amber-500/20 transition">
              <span class="w-2 h-2 rounded-full bg-amber-400 sync-dot"></span>
              <span id="syncText">Setup Cloud Sync</span>
            </span>
          </div>
          <p class="text-xs text-slate-400" id="currentDateDisplay">Weekly Interactive Household Tracker</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <div class="bg-slate-800 p-1 rounded-xl border border-slate-700 flex items-center text-xs font-semibold">
          <button id="btnViewDay" onclick="setViewMode('day')" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white shadow transition"><i class="fa-solid fa-calendar-day mr-1"></i> Day View</button>
          <button id="btnViewGrid" onclick="setViewMode('grid')" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition"><i class="fa-solid fa-table-cells mr-1"></i> Full Week</button>
        </div>
        <button id="adminToggleBtn" onclick="handleAdminClick()" class="px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 border transition bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700">
          <i id="adminLockIcon" class="fa-solid fa-lock text-slate-400"></i>
          <span id="adminBtnText">Admin</span>
        </button>
      </div>
    </div>

    <!-- ADMIN TOOLBAR -->
    <div id="adminToolbar" class="hidden bg-indigo-950/90 border-t border-b border-indigo-500/30 px-4 py-2.5">
      <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
        <div class="text-xs font-semibold text-indigo-200"><span class="px-2 py-0.5 rounded bg-indigo-500 text-white font-bold uppercase text-[10px]">Admin Unlocked</span></div>
        <div class="flex flex-wrap items-center gap-2">
          <button onclick="openAddTaskModal()" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Add Chore</button>
          <button onclick="openColorsModal()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 text-xs font-semibold"><i class="fa-solid fa-palette text-pink-400"></i> Colors</button>
          <button onclick="openChangePinModal()" class="px-3 py-1.5 rounded-lg bg-slate-800 text-amber-300 border border-amber-500/40 text-xs font-bold"><i class="fa-solid fa-key"></i> PIN</button>
          <button onclick="openCloudModal()" class="px-3 py-1.5 rounded-lg bg-slate-800 text-sky-400 border border-slate-600 text-xs font-semibold"><i class="fa-solid fa-cloud"></i> Cloud Sync</button>
          <button onclick="confirmResetWeek()" class="px-3 py-1.5 rounded-lg bg-rose-600 text-white text-xs font-bold"><i class="fa-solid fa-rotate-left"></i> Reset</button>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-7xl mx-auto px-4 pt-4 space-y-5">
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-md">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
        <div class="flex items-center gap-2"><h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Filter by Person</h2></div>
        <div class="flex items-center gap-3">
          <span id="overallStatsText" class="text-xs font-bold text-slate-300">0 / 0 Completed (0%)</span>
          <div class="w-28 h-2 bg-slate-800 rounded-full overflow-hidden">
            <div id="overallProgressBar" class="h-full bg-gradient-to-r from-blue-500 to-emerald-500 transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>
      </div>
      <div id="personFilterContainer" class="flex items-center gap-2 overflow-x-auto pb-1.5 custom-scrollbar"></div>
    </section>

    <section id="dayTabsSection" class="flex items-center justify-between gap-1.5 bg-slate-900 p-1.5 rounded-2xl border border-slate-800 overflow-x-auto custom-scrollbar"></section>
    <section id="dayViewContainer" class="space-y-3"></section>
    <section id="gridViewContainer" class="hidden bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto custom-scrollbar">
        <table class="w-full text-left border-collapse">
          <thead><tr id="gridHeaderRow" class="bg-slate-950/80 border-b border-slate-800 text-[11px] font-extrabold uppercase text-slate-400"></tr></thead>
          <tbody id="gridBodyRows" class="divide-y divide-slate-800/70 text-sm"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- MODALS (PIN, Task, Colors, Cloud) -->
  <div id="pinModal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-white mb-4">Admin Unlock</h3>
      <input type="password" id="pinInput" placeholder="Enter PIN" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-center text-xl font-extrabold text-white mb-2" onkeydown="if(event.key==='Enter') verifyPin()"/>
      <p id="pinError" class="text-xs text-rose-400 text-center h-4 mb-3"></p>
      <div class="flex gap-2"><button onclick="closePinModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">Cancel</button><button onclick="verifyPin()" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold">Unlock</button></div>
    </div>
  </div>

  <div id="changePinModal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-white mb-4">Change Admin PIN</h3>
      <input type="text" id="newPinModalInput" placeholder="New PIN" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-center text-lg font-bold text-white mb-2"/>
      <input type="text" id="confirmPinModalInput" placeholder="Confirm PIN" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-center text-lg font-bold text-white mb-3"/>
      <p id="changePinError" class="text-xs text-rose-400 text-center h-4 mb-3"></p>
      <div class="flex gap-2"><button onclick="closeChangePinModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">Cancel</button><button onclick="saveUpdatedPinFromModal()" class="flex-1 py-2.5 rounded-xl bg-amber-500 text-slate-950 text-xs font-extrabold">Save</button></div>
    </div>
  </div>

  <div id="cloudModal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-white mb-2">JSONbin Cloud Sync</h3>
      <p class="text-xs text-slate-400 mb-4">Paste your JSONbin Bin ID and Master Key to sync instantly across devices.</p>
      <div class="space-y-3 mb-4">
        <input type="text" id="binIdInput" placeholder="Bin ID (e.g. 648...)" class="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs font-mono text-white"/>
        <input type="password" id="masterKeyInput" placeholder="Master Key ($2a$10$...)" class="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs font-mono text-white"/>
      </div>
      <p id="cloudStatusMsg" class="text-xs font-semibold text-emerald-400 mb-3"></p>
      <div class="flex gap-2"><button onclick="closeCloudModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">Close</button><button onclick="connectJsonBin()" class="flex-1 py-2.5 rounded-xl bg-sky-600 text-white text-xs font-bold">Connect Sync</button></div>
    </div>
  </div>

  <div id="taskModal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
      <h3 id="taskModalTitle" class="text-lg font-bold text-white mb-3">Add Chore</h3>
      <input type="text" id="taskNameInput" placeholder="Chore Name" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white mb-3"/>
      <div id="taskModalDaysGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4"></div>
      <div class="flex justify-between"><button id="deleteTaskBtn" onclick="deleteCurrentTask()" class="hidden px-4 py-2 bg-rose-600/20 text-rose-400 text-xs font-bold rounded-xl">Delete</button><div class="flex gap-2 ml-auto"><button onclick="closeTaskModal()" class="px-4 py-2 bg-slate-800 text-slate-300 text-xs font-bold rounded-xl">Cancel</button><button onclick="saveTaskFromModal()" class="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl">Save</button></div></div>
    </div>
  </div>

  <div id="colorsModal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
      <h3 class="text-lg font-bold text-white mb-3">Colors & Roster</h3>
      <div id="peopleColorList" class="space-y-2 mb-4"></div>
      <div class="text-right"><button onclick="closeColorsModal()" class="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl">Done</button></div>
    </div>
  </div>

  <script>
    const DAYS = [
      { key: 'MON', label: 'Mon', full: 'Monday' }, { key: 'TUE', label: 'Tue', full: 'Tuesday' },
      { key: 'WED', label: 'Wed', full: 'Wednesday' }, { key: 'THU', label: 'Thu', full: 'Thursday' },
      { key: 'FRI', label: 'Fri', full: 'Friday' }, { key: 'SAT', label: 'Sat', full: 'Saturday' }, { key: 'SUN', label: 'Sun', full: 'Sunday' }
    ];

    const DEFAULT_COLORS = {
      "Colt": "#3b82f6", "Madi": "#ec4899", "Kam": "#10b981", "Zach": "#f97316",
      "Tanner": "#06b6d4", "Kelly": "#a855f7", "Cary": "#6366f1", "Cary/Kelly": "#8b5cf6",
      "Finnigan": "#eab308", "Everyone": "#14b8a6", "Whoever is asked": "#64748b"
    };

    const INITIAL_CHORES = [
      { id: "c1", task: "Pick up toys/misc", days: { MON: "Madi", TUE: "Colt", WED: "Madi", THU: "Colt", FRI: "Madi", SAT: "Colt", SUN: "Madi" } },
      { id: "c2", task: "Pick up baby toys/misc", days: { MON: "Kam", TUE: "Zach", WED: "Kam", THU: "Zach", FRI: "Kam", SAT: "Zach", SUN: "Kam" } },
      { id: "c3", task: "Get mail", days: { MON: "Colt", TUE: "Madi", WED: "Colt", THU: "Madi", FRI: "Colt", SAT: "Madi", SUN: "Colt" } },
      { id: "c4", task: "Clean out Fridge", days: { MON: "Cary/Kelly", TUE: null, WED: null, THU: null, FRI: "Cary/Kelly", SAT: null, SUN: null } },
      { id: "c5", task: "Get bathroom and laundry room trash", days: { MON: "Colt", TUE: "Colt", WED: "Colt", THU: "Colt", FRI: "Colt", SAT: "Colt", SUN: "Colt" } },
      { id: "c6", task: "Take out trash", days: { MON: "Zach", TUE: "Tanner", WED: "Zach", THU: "Tanner", FRI: "Zach", SAT: "Tanner", SUN: "Zach" } },
      { id: "c7", task: "Trash to Street", days: { MON: null, TUE: "Tanner", WED: null, THU: null, FRI: "Zach", SAT: null, SUN: null } },
      { id: "c8", task: "Cook", days: { MON: "Whoever is asked", TUE: "Whoever is asked", WED: "Whoever is asked", THU: "Whoever is asked", FRI: "Whoever is asked", SAT: "Whoever is asked", SUN: "Whoever is asked" } },
      { id: "c9", task: "Dinner dishes in Dishwasher", days: { MON: "Tanner", TUE: "Kelly", WED: "Zach", THU: "Tanner", FRI: "Kelly", SAT: "Zach", SUN: "Tanner" } },
      { id: "c10", task: "Put up dishes", days: { MON: "Kelly", TUE: "Kam", WED: "Madi", THU: "Kelly", FRI: "Kam", SAT: "Madi", SUN: "Kelly" } },
      { id: "c11", task: "Wipe counters and Table", days: { MON: "Madi", TUE: "Colt", WED: "Kelly", THU: "Tanner", FRI: "Zach", SAT: "Kam", SUN: "Cary" } },
      { id: "c12", task: "Dust", days: { MON: "Kam", TUE: "Madi", WED: "Colt", THU: "Kam", FRI: "Madi", SAT: "Colt", SUN: "Kam" } },
      { id: "c13", task: "Vacuum Rooms", days: { MON: "Madi", TUE: null, WED: null, THU: "Colt", FRI: null, SAT: null, SUN: "Tanner" } },
      { id: "c14", task: "Vacuum", days: { MON: "Kelly", TUE: "Finnigan", WED: "Finnigan", THU: "Finnigan", FRI: "Finnigan", SAT: "Kelly", SUN: "Finnigan" } },
      { id: "c15", task: "Mop", days: { MON: null, TUE: "Kam", WED: null, THU: null, FRI: null, SAT: "Kam", SUN: null } },
      { id: "c16", task: "Tidy up bathroom", days: { MON: "Madi", TUE: "Colt", WED: "Madi", THU: "Colt", FRI: "Madi", SAT: "Colt", SUN: "Madi" } },
      { id: "c17", task: "Clean Bathroom", days: { MON: null, TUE: "Kam", WED: null, THU: null, FRI: null, SAT: "Kam", SUN: null } },
      { id: "c18", task: "Clean bedroom", days: { MON: "Everyone", TUE: "Everyone", WED: "Everyone", THU: "Everyone", FRI: "Everyone", SAT: "Everyone", SUN: "Everyone" } },
      { id: "c19", task: "Bring Laundry from rooms", days: { MON: "Madi", TUE: "Zach", WED: "Tanner", THU: "Colt", FRI: "Kam", SAT: "Madi", SUN: "Zach" } },
      { id: "c20", task: "Bring Laundry from Bathroom", days: { MON: "Colt", TUE: "Kam", WED: "Madi", THU: "Tanner", FRI: "Zach", SAT: "Colt", SUN: "Kam" } },
      { id: "c21", task: "Laundry", days: { MON: "Kelly", TUE: "Kelly", WED: "Kelly", THU: "Kelly", FRI: "Kelly", SAT: "Kelly", SUN: "Kelly" } },
      { id: "c22", task: "Help as Asked", days: { MON: "Everyone", TUE: "Everyone", WED: "Everyone", THU: "Everyone", FRI: "Everyone", SAT: "Everyone", SUN: "Everyone" } },
      { id: "c23", task: "Water plants", days: { MON: "Cary", TUE: "Cary", WED: "Cary", THU: "Cary", FRI: "Cary", SAT: "Cary", SUN: "Cary" } }
    ];

    let appState = { adminPin: "1234", colors: { ...DEFAULT_COLORS }, everyoneMembers: ["Madi", "Colt", "Kam", "Zach", "Tanner"], chores: JSON.parse(JSON.stringify(INITIAL_CHORES)), completed: {} };
    let isAdmin = false, selectedPerson = "ALL", selectedDay = 'MON', viewMode = 'day', editingTaskId = null;
    let binId = localStorage.getItem('jsonbin_id') || "";
    let masterKey = localStorage.getItem('jsonbin_key') || "";
    let syncInterval = null;

    function getSubAssignees(who) {
      if (!who) return [];
      if (who === "Everyone") return appState.everyoneMembers;
      if (who.includes('/')) return who.split('/').map(s => s.trim()).filter(Boolean);
      return [who];
    }
    function isSubAssigneeDone(id, day, p) { return !!appState.completed[`${id}_${day}_${p}`]; }
    function toggleSubAssigneeDone(id, day, p) {
      const key = `${id}_${day}_${p}`;
      if (appState.completed[key]) delete appState.completed[key]; else appState.completed[key] = true;
      saveState();
    }
    function matchesFilter(who, p) { return who && (p === "ALL" || who === p || getSubAssignees(who).includes(p)); }

    function initApp() {
      const saved = localStorage.getItem('finney_chores_jsonbin');
      if (saved) { try { appState = { ...appState, ...JSON.parse(saved) }; } catch(e){} }
      document.getElementById('currentDateDisplay').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
      if (binId && masterKey) { startPolling(); }
      renderAll();
    }

    async function saveState() {
      localStorage.setItem('finney_chores_jsonbin', JSON.stringify(appState));
      renderAll();
      if (binId && masterKey) {
        try {
          await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-Master-Key': masterKey },
            body: JSON.stringify(appState)
          });
        } catch(err) { console.warn("Sync push failed", err); }
      }
    }

    async function pullCloud() {
      if (!binId || !masterKey) return;
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
          headers: { 'X-Master-Key': masterKey }
        });
        if (res.ok) {
          const json = await res.json();
          if (json && json.record) {
            appState = { ...appState, ...json.record };
            localStorage.setItem('finney_chores_jsonbin', JSON.stringify(appState));
            renderAll();
            document.getElementById('syncBadge').className = "cursor-pointer inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30";
            document.getElementById('syncText').textContent = "Cloud Synced";
          }
        }
      } catch(err) { console.warn("Cloud pull failed", err); }
    }

    function startPolling() {
      pullCloud();
      if (syncInterval) clearInterval(syncInterval);
      syncInterval = setInterval(pullCloud, 4000);
    }

    function renderAll() {
      renderAdminUI();
      renderPersonFilters();
      renderDayTabs();
      if (viewMode === 'day') {
        document.getElementById('dayTabsSection').classList.remove('hidden');
        document.getElementById('dayViewContainer').classList.remove('hidden');
        document.getElementById('gridViewContainer').classList.add('hidden');
        renderDayView();
      } else {
        document.getElementById('dayTabsSection').classList.add('hidden');
        document.getElementById('dayViewContainer').classList.add('hidden');
        document.getElementById('gridViewContainer').classList.remove('hidden');
        renderGridView();
      }
    }

    function setViewMode(m) {
      viewMode = m;
      document.getElementById('btnViewDay').className = m === 'day' ? "px-3 py-1.5 rounded-lg bg-blue-600 text-white shadow" : "px-3 py-1.5 rounded-lg text-slate-400";
      document.getElementById('btnViewGrid').className = m === 'grid' ? "px-3 py-1.5 rounded-lg bg-blue-600 text-white shadow" : "px-3 py-1.5 rounded-lg text-slate-400";
      renderAll();
    }

    function renderAdminUI() {
      document.getElementById('adminToolbar').classList.toggle('hidden', !isAdmin);
      document.getElementById('adminToggleBtn').className = isAdmin ? "px-3.5 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow" : "px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300";
      document.getElementById('adminLockIcon').className = isAdmin ? "fa-solid fa-lock-open text-white" : "fa-solid fa-lock text-slate-400";
      document.getElementById('adminBtnText').textContent = isAdmin ? "Lock Admin" : "Admin";
    }

    function renderPersonFilters() {
      let total = 0, done = 0, stats = {};
      Object.keys(appState.colors).forEach(p => stats[p] = {t:0, d:0});
      appState.chores.forEach(c => DAYS.forEach(d => {
        const who = c.days[d.key];
        if (who) getSubAssignees(who).forEach(p => {
          total++; if (isSubAssigneeDone(c.id, d.key, p)) done++;
          if (!stats[p]) stats[p] = {t:0, d:0};
          stats[p].t++; if (isSubAssigneeDone(c.id, d.key, p)) stats[p].d++;
        });
      }));
      const pct = total > 0 ? Math.round((done/total)*100) : 0;
      document.getElementById('overallStatsText').textContent = `${done} / ${total} (${pct}%)`;
      document.getElementById('overallProgressBar').style.width = `${pct}%`;

      let html = `<button onclick="selectPerson('ALL')" class="shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold border ${selectedPerson==='ALL'?'bg-white text-slate-900':'bg-slate-800 text-slate-300'}">All Household (${done}/${total})</button>`;
      Object.keys(appState.colors).filter(p => stats[p] && stats[p].t > 0).forEach(p => {
        const col = appState.colors[p], isSel = selectedPerson === p;
        html += `<button onclick="selectPerson('${p}')" style="${isSel?`background:${col};color:#fff;`:`background:${col}22;color:#fff;`}" class="shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold border border-slate-700 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full" style="background:${col}"></span>${p} (${stats[p].d}/${stats[p].t})</button>`;
      });
      document.getElementById('personFilterContainer').innerHTML = html;
    }

    function selectPerson(p) { selectedPerson = p; renderAll(); }

    function renderDayTabs() {
      let html = '';
      DAYS.forEach(d => {
        let t = 0, dn = 0;
        appState.chores.forEach(c => {
          const who = c.days[d.key];
          if (matchesFilter(who, selectedPerson)) getSubAssignees(who).filter(p => selectedPerson==='ALL'||p===selectedPerson).forEach(p => { t++; if(isSubAssigneeDone(c.id, d.key, p)) dn++; });
        });
        const isAct = selectedDay === d.key;
        html += `<button onclick="selectDay('${d.key}')" class="flex-1 min-w-[85px] py-2.5 px-3 rounded-xl text-center border ${isAct?'bg-blue-600 border-blue-400 text-white':'bg-slate-800 text-slate-400'}"><div class="text-xs font-extrabold">${d.label}</div><div class="text-[11px] font-semibold">${dn}/${t}</div></button>`;
      });
      document.getElementById('dayTabsSection').innerHTML = html;
    }
    function selectDay(k) { selectedDay = k; renderAll(); }

    function renderDayView() {
      const container = document.getElementById('dayViewContainer');
      const matching = appState.chores.filter(c => isAdmin && selectedPerson==='ALL' || matchesFilter(c.days[selectedDay], selectedPerson));
      if (matching.length === 0) { container.innerHTML = `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-10 text-center text-slate-400 text-sm">No chores today.</div>`; return; }

      let html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-3">`;
      matching.forEach(c => {
        const who = c.days[selectedDay], subs = getSubAssignees(who);
        const col = appState.colors[who] || '#64748b';
        let subHtml = '';
        if (subs.length > 1) {
          subHtml = `<div class="mt-3 pt-2.5 border-t border-slate-800 flex flex-wrap gap-2">`;
          subs.forEach(p => {
            const done = isSubAssigneeDone(c.id, selectedDay, p);
            subHtml += `<button onclick="toggleSubAssigneeDone('${c.id}','${selectedDay}','${p}')" class="px-3 py-1.5 rounded-xl text-xs font-bold border ${done?'bg-emerald-500/20 border-emerald-500 text-emerald-300':'bg-slate-950 border-slate-700 text-white'}"><i class="fa-solid fa-check mr-1"></i>${p}</button>`;
          });
          subHtml += `</div>`;
        }
        const singleDone = subs.length === 1 && isSubAssigneeDone(c.id, selectedDay, subs[0]);
        html += `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-md" style="border-left: 5px solid ${col};">
            <div class="flex items-center justify-between gap-3">
              <div onclick="${subs.length===1?`toggleSubAssigneeDone('${c.id}','${selectedDay}','${subs[0]}')`:''}" class="flex items-center gap-3.5 flex-1 ${subs.length===1?'cursor-pointer':''}">
                ${subs.length===1?`<button class="w-7 h-7 rounded-xl flex items-center justify-center border-2 ${singleDone?'bg-emerald-500 border-emerald-500 text-slate-950':'bg-slate-950 border-slate-600 text-transparent'}"><i class="fa-solid fa-check text-sm font-bold"></i></button>`:''}
                <div>
                  <div class="text-sm sm:text-base font-bold ${singleDone?'line-through text-slate-500':'text-white'}">${c.task}</div>
                  <div class="text-[11px] text-slate-400">${subs.length>1?'Multiple people assigned':`Assigned to ${who}`}</div>
                </div>
              </div>
              <span class="px-3 py-1.5 rounded-xl text-xs font-bold text-white border" style="background:${col}33;border-color:${col}">${who||'Unassigned'}</span>
            </div>
            ${subHtml}
          </div>
        `;
      });
      html += `</div>`;
      container.innerHTML = html;
    }

    function renderGridView() {
      const hRow = document.getElementById('gridHeaderRow'), bRows = document.getElementById('gridBodyRows');
      hRow.innerHTML = `<th class="py-3 px-4 bg-slate-950 border-r border-slate-800">TASKS</th>` + DAYS.map(d=>`<th class="py-3 px-2 text-center border-r border-slate-800">${d.key}</th>`).join('');
      let b = '';
      appState.chores.forEach(c => {
        b += `<tr class="hover:bg-slate-800/40"><td class="py-3 px-4 font-bold text-slate-200 border-r border-slate-800 text-xs">${c.task}</td>`;
        DAYS.forEach(d => {
          const who = c.days[d.key], subs = getSubAssignees(who);
          b += `<td class="p-2 border-r border-slate-800 text-center text-xs">${who||'&mdash;'}</td>`;
        });
        b += `</tr>`;
      });
      bRows.innerHTML = b;
    }

    function handleAdminClick() {
      if (isAdmin) { isAdmin = false; renderAll(); } else { document.getElementById('pinModal').classList.remove('hidden'); }
    }
    function closePinModal() { document.getElementById('pinModal').classList.add('hidden'); }
    function verifyPin() {
      if (document.getElementById('pinInput').value.trim() === appState.adminPin) { isAdmin = true; closePinModal(); renderAll(); }
      else { document.getElementById('pinError').textContent = 'Incorrect PIN'; }
    }
    function openChangePinModal() { document.getElementById('changePinModal').classList.remove('hidden'); }
    function closeChangePinModal() { document.getElementById('changePinModal').classList.add('hidden'); }
    function saveUpdatedPinFromModal() {
      const p1 = document.getElementById('newPinModalInput').value, p2 = document.getElementById('confirmPinModalInput').value;
      if (p1 && p1 === p2) { appState.adminPin = p1; saveState(); closeChangePinModal(); alert("PIN updated!"); }
      else { document.getElementById('changePinError').textContent = 'PINs must match'; }
    }
    function confirmResetWeek() { if(confirm("Reset all checkmarks?")) { appState.completed = {}; saveState(); } }
    function openCloudModal() {
      document.getElementById('binIdInput').value = binId;
      document.getElementById('masterKeyInput').value = masterKey;
      document.getElementById('cloudModal').classList.remove('hidden');
    }
    function closeCloudModal() { document.getElementById('cloudModal').classList.add('hidden'); }
    async function connectJsonBin() {
      binId = document.getElementById('binIdInput').value.trim();
      masterKey = document.getElementById('masterKeyInput').value.trim();
      localStorage.setItem('jsonbin_id', binId);
      localStorage.setItem('jsonbin_key', masterKey);
      document.getElementById('cloudStatusMsg').textContent = "Testing connection...";
      await pullCloud();
      closeCloudModal();
      startPolling();
    }
    function openColorsModal() {
      let html = '';
      Object.entries(appState.colors).forEach(([p, col]) => {
        html += `<div class="flex items-center justify-between bg-slate-950 p-2.5 rounded-xl"><span class="text-xs font-bold text-white">${p}</span><input type="color" value="${col}" onchange="appState.colors['${p}']=this.value; saveState(); openColorsModal();" class="w-8 h-8 bg-transparent cursor-pointer"/></div>`;
      });
      document.getElementById('peopleColorList').innerHTML = html;
      document.getElementById('colorsModal').classList.remove('hidden');
    }
    function closeColorsModal() { document.getElementById('colorsModal').classList.add('hidden'); }
    function openAddTaskModal() { document.getElementById('taskModal').classList.remove('hidden'); }
    function closeTaskModal() { document.getElementById('taskModal').classList.add('hidden'); }
    function saveTaskFromModal() {
      const name = document.getElementById('taskNameInput').value.trim();
      if(name) { appState.chores.push({ id:'c_'+Date.now(), task:name, days:{MON:'Colt'} }); saveState(); closeTaskModal(); }
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
